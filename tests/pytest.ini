[pytest]
testpaths = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra --tb=short -p no:cacheprovider
markers =
    itest: integration-plan id
    browser: needs Chromium + the UI dev server
    slow: plays a lesson in real time
filterwarnings =
    ignore::DeprecationWarning
