name: verify

on:
  push:
  pull_request:

jobs:
  contracts-content-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pip install -e 'services/agent[dev]' fastapi 'uvicorn[standard]' 'websockets>=13' 'apscheduler>=3.10,<4' pyyaml
      - run: pnpm install --frozen-lockfile
      - run: python3 tools/lesson-lint/selftest.py
      - run: python3 tools/lesson-lint/lesson_lint.py content/lessons/market-food/market-food-01.md --strict --no-color
      - run: python3 -m pytest -q tests/test_autonomous_lesson_contract.py tests/test_product_smoke_harness.py tests/test_composed_smoke_harness.py
      - run: pytest -q services/classroom-core/tests
        env:
          PYTHONPATH: services/classroom-core:packages/contracts/python
      - run: pytest -q -m 'not live'
        working-directory: services/agent
      - run: pnpm --filter @bright/airi-bridge typecheck
      - run: pnpm --filter @bright/airi-bridge test
      - run: pnpm --filter @bright/airi-bridge build
      - run: pnpm --filter @bright/classroom-ui typecheck
      - run: pnpm --filter @bright/classroom-ui build
