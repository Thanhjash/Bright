[project]
name = "bright-agent"
version = "0.1.0"
description = "Bright TeacherAgent — decides what to teach next"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bright_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: hits the real LLM endpoint; skipped unless LLM_API_KEY is set",
]
filterwarnings = ["error::DeprecationWarning:bright_agent.*"]
