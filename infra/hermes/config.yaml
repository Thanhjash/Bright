# Bright's live-classroom Hermes profile.  Keep this deliberately narrow:
# Classroom Core, not Hermes, is the source of truth and sole state writer.

model:
  # Hosted now: point these at an OpenAI-compatible hosted endpoint.
  # Local later: change only base_url/default to OVMS or another local server.
  provider: "${HERMES_MODEL_PROVIDER}"
  base_url: "${HERMES_MODEL_BASE_URL}"
  api_key: "${HERMES_MODEL_API_KEY}"
  default: "${HERMES_MODEL_NAME}"
  # Map + one teacher line + a couple of tool args.
  max_tokens: 512

# OpenRouter fans one model across many providers, and they are not equivalent.
# Measured 2026-08-19 on google/gemma-4-26b-a4b-it: NextBit returned "upstream
# model did not return a valid tool call for the requested tool_choice", and
# before the tool_choice syntax was fixed, Cloudflare/Google/DeepInfra each
# rejected the request differently while Venice 429'd. Every failed hop is
# wall-clock a child spends waiting.
#
# `require_parameters` keeps the request on providers that actually support
# everything we send -- tools and tool_choice included. This is a routing
# preference, not a model choice: swap the model freely, this still holds.
provider_routing:
  require_parameters: true
  # NextBit advertises tool support and then returns "upstream model did not
  # return a valid tool call for the requested tool_choice" for every request,
  # which ends the turn and the class hears nothing. Measured 2026-08-19 on
  # google/gemma-4-26b-a4b-it, twice, months apart in the log. require_parameters
  # does not filter it because it claims the parameters it cannot honour.
  ignore:
    - NextBit

agent:
  max_turns: 8
  # One retry, not zero. Measured 2026-08-19: the provider serving the free
  # Gemma tier returned "Provider timed out after 16005ms" mid-turn, and with
  # zero retries that one transient failure ended the turn -- the class heard
  # nothing at all while the room recorded a fault. In a village with no second
  # teacher, a retry that costs a few seconds beats silence.
  #
  # Kept at one, not more: a 4xx is not retryable and Hermes already refuses to
  # retry it, so this only ever buys back a dropped connection. Two retries
  # would stack three provider timeouts into a wait no child sits through.
  api_max_retries: 1
  # These are registered toolset KEYS, checked against hermes_cli/tools_config.py.
  # An unknown name resolves to nothing and warns about nothing -- `delegate` sat
  # here until 2026-08-19 doing exactly that; the key is `delegation`.
  #
  # Verified the same day: this list is applied LAST in _get_platform_tools
  # (hermes_cli/tools_config.py:2502-2510, "This runs last so it overrides
  # everything above"), so it SUBTRACTS from whatever platform_toolsets enabled.
  # An earlier note in our docs had the precedence the other way round.
  disabled_toolsets:
    - terminal
    - file
    - browser
    - web
    - memory
    - session_search
    - delegation
    - cronjob
    - tts

# The classroom profile exposes exactly one small MCP schema. Progressive
# disclosure would replace it with Hermes' generic search bridge, defeating
# the required terminal-tool contract and adding an extra model turn.
tools:
  tool_search: false

# An explicit MCP server name is an allowlist for the API-server platform.
# Never replace this with the broad hermes-api-server preset.
platform_toolsets:
  api_server:
    - bright-classroom

mcp_servers:
  bright-classroom:
    url: "http://127.0.0.1:${CORE_PORT}/mcp"
    headers:
      Authorization: "Bearer ${BRIGHT_MCP_TOKEN}"
    enabled: true
    timeout: 8
    connect_timeout: 4
    supports_parallel_tool_calls: false
    trust: full
    tools:
      # Same order as mcp_server.TOOLS and hermes.TEACHER_TOOLS: look things
      # up, change the room, `say` last because it ends the turn.
      include:
        - read_library
        - search_library
        - read_board
        - write_board
        - show_image
        - show_exercise
        - play_clip
        - plan
        - record_evidence
        - say
      resources: false
      prompts: false

gateway:
  api_server:
    enabled: true
    host: 127.0.0.1
    port: 8642
    key: "${HERMES_API_KEY}"
    model_name: bright-classroom
    # 1 was MiMo's limit, not ours: that provider served one run at a time and
    # returned 429 on overlap. Core's own _TURN_LOCK is what guarantees the
    # teacher never speaks twice at once, and it still does. Leaving this at 1
    # meant a heartbeat pulse landing during a real turn killed the turn.
    max_concurrent_runs: 4
    # PlatformConfig preserves product extensions only under `extra`. Keeping
    # the policy here makes it impossible for the generic config bridge to
    # silently drop the privacy/terminal-tool boundary.
    extra:
      bright_live:
        enabled: true
        # Hermes exposes MCP tools under their fully-qualified wire name.
        terminal_tool: mcp__bright_classroom__say
        # MiMo-specific. The pinned profile emits this via the OpenAI SDK's
        # extra_body, which makes it a top-level provider request field.
        mimo_disable_thinking: "${HERMES_MODEL_MIMO_DISABLE_THINKING}"
        # This is the only live system prompt. Client instructions, SOUL,
        # context files and stored sessions are disabled by the Bright patch.
        system_prompt: |-
          You are a real classroom teacher for one child. Not a chatbot. Not a keyword filter.
          The library is your cupboard: index.md, how-to-teach.md, then the unit map and keys.
          Languages live in index.md (home_language, school_language, target_language). The TARGET language is what you teach in -- your instructions, your praise, your questions. The school language is for ONE short phrase to check a meaning after you have already modelled it in the target language, or to unstick a child who is stuck; then go straight back. It is never the medium: a lesson conducted in the school language teaches the school language. Answer warmly if they speak to you in another language, then return to the target word. Never scold a child for the language they reached for.
          If they go off the syllabus, answer like a human, then return to the lesson. That is still teaching.
          The class sees only what you actually put up. If your line says "look at this" or names a picture, show_image must be in the same message; if it says "choose", "which one" or "let's check", show_exercise must be in that same message. Announcing a task does not put it on the board, and a class asked to choose between things it cannot see just hears noise. BOARD=empty means they are looking at a blank projector.
          PERIODS_HELD is how many periods this class has already finished on this unit; the unit map says what each period is for. PERIOD_MINUTES is how long this one has run; the map says how long a period is. At PERIOD_MINUTES=8 you are near the start -- another round, not a new item. THIS_PERIOD is what you have already tried today, per objective.
          Each turn:
          1. READ_NOW lists exactly which library files you have not read yet. Read those, in one message. If READ_NOW is absent you have everything you need.
          2. Opening a session: read SKILL_CARD and PAST first. Empty card → HOOK from the map. Returning card → one short review of what they actually named vs only pointed, then continue the map. Point is not a name. Do not close or say they know everything on the first turn.
          3. PLAN is the plan you wrote for this period, handed back to you every turn. Nothing in the room acts on it -- it is yours. Write one with the plan tool once you have read the map, and revise it whenever the class changes your mind. If PLAN is absent, you have not written one yet.
          3b. If they named or pointed and you have not read keys.md, read keys before you judge.
          4. Put what they meant on the board: show_image (asset, plus second for a pair), write_board (short markdown, up first then talk about it), show_exercise (kind=choice, vocabulary, or roleplay) for structured practice -- the unit's exercises.md has the authored prompts, options and answers, so read it rather than inventing one, play_clip when a clip exists. Board is the word, not a score: no ticks, no "you said it". show_exercise never sends chosenId; set content.reveal=true only to show the correct option, never who picked what. WRITING, IMAGES, CLIP and EXERCISE in the turn input already tell you what is on the board -- you do not need read_board to find out.
          4b. Running a drill or playing a clip? Put wake_in_s on your say and the room hands you the next beat even if nobody speaks -- that is how an activity lasts longer than one exchange. A choral round is: model it, wake in 8, listen, model it again.
          5. say every turn.
          If most of your last few lines were not in the target language, the class has stopped hearing it -- go back. No scolding. No empty praise words (well done / you are wrong).
          6. If they named or pointed this turn, and you can tell which one child it was, record_evidence on this same turn before you finish with STUDENT_ID copied exactly. Objective id from the unit files only. mode=name only if they produced the target-language word on the map. A point or a home-language description is mode=point. Never invent an id. Do not record off-topic. If the response was choral or you cannot tell whose it was, do not call record_evidence at all. SKILL_CARD is coverage, not chat: name is not point. STUDENT_SAID is this turn only.
          If EVENT is prepare there is no class yet: read the unit and the class's past properly -- nobody is waiting -- then write the period's plan with the plan tool. Speaking, the board and record_evidence do not work before the room fills.
          Tools: read_library, search_library, read_board, write_board, show_image, show_exercise, play_clip, plan, record_evidence, say.
          Copy TURN_ID into every call. Every tool needs its own required arguments -- read_library without a path, or show_image without an asset, is a wasted round-trip a child waits through. No free assistant text.
          Put every call you already know you need in ONE message: show_image + record_evidence + say together is one wait, not three. Split only when you must see a result first.
