# Bright's live-classroom Hermes profile.  Keep this deliberately narrow:
# Classroom Core, not Hermes, is the source of truth and sole state writer.

model:
  # Hosted now: point these at an OpenAI-compatible hosted endpoint.
  # Local later: change only base_url/default to OVMS or another local server.
  provider: "${HERMES_MODEL_PROVIDER}"
  base_url: "${HERMES_MODEL_BASE_URL}"
  api_key: "${HERMES_MODEL_API_KEY}"
  default: "${HERMES_MODEL_NAME}"
  # One short teacher line plus the terminal proposal arguments.
  max_tokens: 256

agent:
  # Declare zero provider retries. Upstream internally clamps this to one
  # total attempt; the pinned Bright patch also enforces that internal value.
  max_turns: 1
  api_max_retries: 0
  disabled_toolsets:
    - terminal
    - file
    - browser
    - web
    - memory
    - session_search
    - delegate
    - cronjob
    - tts

# The classroom profile exposes exactly one small MCP schema. Progressive
# disclosure would replace it with Hermes' generic search bridge, defeating
# the required terminal-tool contract and adding an extra model turn.
tools:
  tool_search: false

# An explicit MCP server name is an allowlist for the API-server platform.
# Never replace this with the broad hermes-api-server preset.
platform_toolsets:
  api_server:
    - bright-classroom

mcp_servers:
  bright-classroom:
    url: "http://127.0.0.1:${CORE_PORT}/mcp"
    headers:
      Authorization: "Bearer ${BRIGHT_MCP_TOKEN}"
    enabled: true
    timeout: 2
    connect_timeout: 1
    supports_parallel_tool_calls: false
    trust: full
    tools:
      include:
        - classroom_propose_move
      resources: false
      prompts: false

gateway:
  api_server:
    enabled: true
    host: 127.0.0.1
    port: 8642
    key: "${HERMES_API_KEY}"
    model_name: bright-classroom
    max_concurrent_runs: 1
    # PlatformConfig preserves product extensions only under `extra`. Keeping
    # the policy here makes it impossible for the generic config bridge to
    # silently drop the privacy/terminal-tool boundary.
    extra:
      bright_live:
        enabled: true
        # Hermes exposes MCP tools under their fully-qualified wire name.
        terminal_tool: mcp__bright_classroom__classroom_propose_move
        # MiMo-specific. The pinned profile emits this via the OpenAI SDK's
        # extra_body, which makes it a top-level provider request field.
        mimo_disable_thinking: "${HERMES_MODEL_MIMO_DISABLE_THINKING}"
        # This is the only live system prompt. Client instructions, SOUL,
        # context files and stored sessions are disabled by the Bright patch.
        system_prompt: |-
          You are Bright's live English teacher decision engine for one current classroom turn.
          The input is fresh authoritative state from Classroom Core. Do not invent hidden state.
          Make one bounded teaching decision, then call mcp__bright_classroom__classroom_propose_move exactly once.
          Its arguments are turn_id, move_id, and teacher_line.
          Copy the exact BRIGHT TURN ID from the input. Choose only an allowed move from the input.
          teacher_line MUST be exactly one short, warm, non-evaluative sentence for Grade 4 pre-A1 learners.
          End it with one period. Do not use abbreviations, lists, semicolons, or any other period, question mark, or exclamation mark.
          Never write free assistant text. Never call another tool. Never retry, summarize, plan a future turn, or claim a move was applied.
